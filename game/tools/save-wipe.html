<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>UAIDZIN — Limpar Save</title>
  <style>
    :root {
      --bg0: #100c08;
      --bg1: #241c14;
      --gold: #d4a017;
      --blood: #a33b3b;
      --ink: #f0e6d0;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Georgia, "Times New Roman", serif;
      background: radial-gradient(circle at 30% 20%, #2a2016, var(--bg0));
      color: var(--ink);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      width: min(520px, 100%);
      background: var(--bg1);
      border: 2px solid #3a2e22;
      box-shadow: 0 0 0 1px var(--gold), 0 12px 40px rgba(0,0,0,.55);
      padding: 28px 24px;
      border-radius: 2px;
    }
    h1 {
      margin: 0 0 8px;
      font-size: 1.4rem;
      color: var(--gold);
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }
    p { margin: 0 0 18px; opacity: 0.85; line-height: 1.45; }
    label { display: block; margin: 12px 0 6px; font-size: 0.9rem; }
    input {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #4a3c2c;
      background: var(--bg0);
      color: var(--ink);
      border-radius: 2px;
    }
    .row { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 18px; }
    button {
      border: 1px solid var(--gold);
      background: #1a140e;
      color: var(--ink);
      padding: 10px 14px;
      border-radius: 2px;
      cursor: pointer;
      font: inherit;
    }
    button.danger {
      border-color: var(--blood);
      color: #f0cfcf;
    }
    button:hover { filter: brightness(1.1); }
    #log {
      margin-top: 18px;
      min-height: 64px;
      padding: 10px;
      background: #0a0806;
      border: 1px solid #3a2e22;
      white-space: pre-wrap;
      font-family: Consolas, monospace;
      font-size: 12px;
    }
    a { color: var(--gold); }
  </style>
</head>
<body>
  <div class="card">
    <h1>Limpar Save</h1>
    <p>Cópia de desenvolvimento. Preferir <code>/tools/save-wipe.html</code> no servidor Vite.</p>
    <p><a href="../public/tools/save-wipe.html">Abrir versão pública</a></p>
  </div>
</body>
</html>
