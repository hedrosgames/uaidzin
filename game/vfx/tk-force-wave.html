<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ForceWaveUAID · TK</title>
  <style>
    :root { color-scheme: dark; font-family: "Segoe UI", sans-serif; color: #f0e6d0; background: #100c08; }
    * { box-sizing: border-box; user-select: none; }
    body { margin: 0; overflow: hidden; }
    canvas { display: block; width: 100vw; height: 100vh; touch-action: none; }
    header, footer { position: fixed; left: 24px; right: 24px; display: flex; gap: 16px; align-items: center; flex-wrap: wrap; padding: 16px 20px; border: 1px solid #534536; background: #100c08ed; box-shadow: inset 0 0 0 1px #d4a01726; }
    header { top: 24px; border-top: 2px solid #d4a017; pointer-events: none; }
    footer { bottom: 24px; border-bottom: 2px solid #d4a017; }
    h1 { margin: 0; font: 24px Georgia, serif; }
    small { color: #b9aa94; }
    .stats { margin-left: auto; font-variant-numeric: tabular-nums; }
    button, select { font: inherit; color: #f0e6d0; background: #241c14; border: 1px solid #756048; border-radius: 2px; padding: 9px 12px; }
    button { cursor: pointer; }
    button:hover { border-color: #d4a017; }
    #cast { background: #a33b3b; }
    label { display: flex; align-items: center; gap: 8px; font-size: 13px; }
    input { user-select: text; accent-color: #d4a017; max-width: 125px; }
    @media (max-width: 720px) { header, footer { left: 8px; right: 8px; padding: 12px; gap: 8px; } h1 { font-size: 19px; } header small { display: none; } .stats { font-size: 12px; } }
  </style>
</head>
<body>
  <canvas id="gl" aria-label="Prévia 3D da Force Wave"></canvas>
  <header>
    <div><h1>ForceWaveUAID</h1><small>TK · Força física · Quarks · Atlas de 16 quadros</small></div>
    <div class="stats" id="state">Carregando</div>
  </header>
  <footer>
    <button id="cast">Disparar</button>
    <button id="loop" aria-pressed="false">Repetir</button>
    <button id="pause" aria-pressed="false">Pausar</button>
    <label>Velocidade <input id="speed" type="range" min="0.1" max="1" step="0.1" value="1"><span id="speed-value">1×</span></label>
    <label>Alvo <select id="target-direction">
      <option value="0">Frente</option><option value="1">Direita</option>
      <option value="2">Esquerda</option><option value="3">Atrás</option>
      <option value="4">Acima</option><option value="5">Abaixo</option>
      <option value="6">Próximo</option>
    </select></label>
    <label>Câmera <select id="view"><option value="iso">Isométrica</option><option value="top">Superior</option><option value="side">Lateral</option><option value="third">Terceira pessoa</option></select></label>
    <label>Tempo <input id="time" type="range" min="0" max="350" step="16.6666667" value="0"><span id="time-value">0 ms</span></label>
  </footer>
  <script type="module" src="/src/presentation/effects/tkSkills/force-wave/demo.ts"></script>
</body>
</html>
