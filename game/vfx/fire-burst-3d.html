<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <title>Fire Burst · Prévia 3D</title>
    <style>
      :root {
        --void: #000;
        --background: #100c08;
        --panel: #241c14;
        --gold: #d4a017;
        --red: #a33b3b;
        --text: #f0e6d0;
        --muted: #b1a28b;
        --iron: #514638;
        --raised: #342a1e;
        --stage-scale: 1;
        font-family: "Segoe UI", sans-serif;
        color: var(--text);
        background: var(--void);
      }

      * {
        box-sizing: border-box;
        user-select: none;
        -webkit-user-select: none;
      }

      input,
      textarea,
      [contenteditable="true"] {
        user-select: text;
        -webkit-user-select: text;
      }

      body {
        margin: 0;
        overflow: hidden;
      }

      button,
      input,
      select {
        font: inherit;
      }

      .viewport {
        position: fixed;
        inset: 0;
        overflow: hidden;
        background: var(--void);
      }

      .study-screen {
        position: absolute;
        top: 50%;
        left: 50%;
        width: 1600px;
        height: 900px;
        overflow: hidden;
        background: var(--background);
        transform: translate(-50%, -50%) scale(var(--stage-scale));
        transform-origin: center;
      }

      .study-screen__scene,
      .study-screen__scene canvas {
        position: absolute;
        inset: 0;
        display: block;
        width: 100%;
        height: 100%;
      }

      .study-screen__scene canvas {
        touch-action: none;
      }

      .iron-panel {
        position: relative;
        border: 1px solid var(--iron);
        border-radius: 2px;
        background: var(--panel);
      }

      .iron-panel::before,
      .iron-panel::after {
        position: absolute;
        width: 12px;
        height: 12px;
        content: "";
        pointer-events: none;
      }

      .iron-panel::before {
        top: -1px;
        left: -1px;
        border-top: 2px solid var(--gold);
        border-left: 2px solid var(--gold);
      }

      .iron-panel::after {
        right: -1px;
        bottom: -1px;
        border-right: 2px solid var(--gold);
        border-bottom: 2px solid var(--gold);
      }

      .study-screen__heading {
        position: absolute;
        top: 28px;
        left: 32px;
        display: flex;
        align-items: center;
        padding: 14px 20px;
      }

      .study-screen__title {
        margin: 0;
        font-family: Georgia, serif;
        font-size: 26px;
        font-weight: 400;
        letter-spacing: 1px;
      }

      .study-screen__edition {
        margin-left: 22px;
        padding-left: 22px;
        border-left: 1px solid var(--iron);
        color: var(--gold);
        font-size: 13px;
        letter-spacing: 1px;
      }

      .study-screen__status {
        position: absolute;
        top: 28px;
        right: 32px;
        margin: 0;
        padding: 15px 18px;
        color: var(--muted);
        font-size: 13px;
      }

      .study-screen__status[data-state="error"] {
        border-color: var(--red);
        color: var(--text);
      }

      .playback {
        position: absolute;
        bottom: 28px;
        left: 300px;
        display: flex;
        flex-direction: column;
        width: 1000px;
        padding: 18px 22px;
      }

      .playback__controls,
      .playback__timeline,
      .playback__readout,
      .playback__speed {
        display: flex;
        align-items: center;
      }

      .playback__controls {
        justify-content: space-between;
      }

      .playback__actions {
        display: flex;
      }

      .playback__button,
      .playback__select {
        min-height: 38px;
        padding: 8px 16px;
        border: 1px solid var(--iron);
        border-radius: 2px;
        outline: none;
        background: var(--background);
        color: var(--text);
        cursor: pointer;
        transition: background-color 120ms, border-color 120ms;
      }

      .playback__button {
        min-width: 120px;
        margin-right: 10px;
        font-size: 14px;
      }

      .playback__button--primary {
        border-color: var(--gold);
        color: var(--gold);
      }

      .playback__button:hover,
      .playback__select:hover {
        border-color: var(--gold);
        background: var(--raised);
      }

      .playback__button:active,
      .playback__select:active {
        background: var(--iron);
      }

      .playback__button:focus,
      .playback__select:focus,
      .playback__scrub:focus {
        outline: 2px solid var(--gold);
        outline-offset: 3px;
      }

      .playback__button:disabled,
      .playback__select:disabled,
      .playback__scrub:disabled {
        border-color: var(--iron);
        background: var(--background);
        color: var(--muted);
        opacity: 0.45;
        cursor: not-allowed;
      }

      .playback__speed {
        color: var(--muted);
        font-size: 13px;
      }

      .playback__select {
        min-width: 90px;
        margin-left: 12px;
      }

      .playback__readout {
        justify-content: space-between;
        margin-top: 17px;
        font-size: 13px;
        font-variant-numeric: tabular-nums;
      }

      .playback__phase {
        color: var(--gold);
      }

      .playback__frame {
        color: var(--muted);
      }

      .playback__timeline {
        margin-top: 6px;
      }

      .playback__scrub {
        width: 100%;
        height: 20px;
        margin: 0;
        border-radius: 2px;
        outline: none;
        background: transparent;
        accent-color: var(--gold);
        cursor: pointer;
      }

      .playback__scrub:hover {
        background: var(--raised);
      }

      .playback__scrub:active {
        background: var(--iron);
      }
    </style>
  </head>
  <body>
    <main class="viewport" id="viewport">
      <section class="study-screen" id="stage" aria-label="Prévia 3D de Fire Burst">
        <div class="study-screen__scene" id="scene"></div>
        <header class="study-screen__heading iron-panel">
          <h1 class="study-screen__title">Fire Burst</h1>
          <span class="study-screen__edition">Arte aprovada</span>
        </header>
        <p class="study-screen__status iron-panel" id="status" role="status" aria-live="polite">
          Carregando arte…
        </p>
        <section class="playback iron-panel" aria-label="Reprodução">
          <div class="playback__controls">
            <div class="playback__actions">
              <button class="playback__button" id="play" type="button" disabled>Reproduzir</button>
              <button class="playback__button playback__button--primary" id="cast" type="button" disabled>Disparar</button>
              <button class="playback__button" id="reset-camera" type="button" disabled>Restaurar câmera</button>
            </div>
            <label class="playback__speed" for="speed">
              Velocidade
              <select class="playback__select" id="speed" disabled>
                <option value="0.25">0,25×</option>
                <option value="0.5">0,5×</option>
                <option value="1" selected>1×</option>
                <option value="1.5">1,5×</option>
                <option value="2">2×</option>
              </select>
            </label>
          </div>
          <div class="playback__readout">
            <span class="playback__phase" id="phase">Preparação</span>
            <span class="playback__frame" id="frame">Quadro 01 / 65</span>
            <output id="time" for="timeline">0,00 / 2,70 s</output>
          </div>
          <div class="playback__timeline">
            <input
              class="playback__scrub"
              id="timeline"
              type="range"
              min="0"
              max="2.7"
              step="0.001"
              value="0"
              aria-label="Tempo da animação"
              disabled
            />
          </div>
        </section>
      </section>
    </main>
    <script type="module" src="/src/presentation/effects/fireBurst/artPreview.ts"></script>
  </body>
</html>
