<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UAIDZIN — Login</title>
<style>
:root{
  --bg0:#100c08;
  --bg1:#241c14;
  --bg2:#2e241a;
  --iron:#3d3228;
  --iron-hi:#5a4a38;
  --gold:#d4a017;
  --gold-hi:#e8c547;
  --gold-dim:#8a6d18;
  --blood:#a33b3b;
  --blood-hi:#d45555;
  --frost:#5b9fd4;
  --frost-hi:#8ec8f0;
  --ink:#f0e6d0;
  --ink-dim:#b8a88c;
  --ink-mute:#7a6b58;
  --ok:#5a9e5a;
  --font-display:Georgia,"Palatino Linotype","Book Antiqua",Palatino,serif;
  --font-ui:"Segoe UI",system-ui,sans-serif;
  --font-num:ui-monospace,Consolas,monospace;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0;background:#000;overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input,textarea,[contenteditable="true"]{-webkit-user-select:text;user-select:text}
body{font-family:var(--font-ui);color:var(--ink)}


.viewport{
  position:fixed;inset:0;
  display:flex;align-items:center;justify-content:center;
  overflow:hidden;background:#000;
}
.stage{
  position:relative;
  width:1600px;height:900px;
  flex-shrink:0;
  overflow:hidden;
  transform-origin:center center;
  background:
    radial-gradient(ellipse 900px 500px at 50% 20%, #2a1c10 0%, transparent 55%),
    radial-gradient(ellipse 600px 400px at 80% 90%, #1a120c 0%, transparent 50%),
    var(--bg0);
}

.stage::before{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:
    radial-gradient(circle 2px at 12% 30%, rgba(212,160,23,.35), transparent 3px),
    radial-gradient(circle 1.5px at 78% 22%, rgba(212,160,23,.25), transparent 3px),
    radial-gradient(circle 2px at 88% 70%, rgba(163,59,59,.2), transparent 3px),
    radial-gradient(circle 1px at 30% 80%, rgba(212,160,23,.3), transparent 2px);
}

.panel{
  position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  width:420px;z-index:1;
  background:
    linear-gradient(180deg, rgba(255,255,255,.04) 0%, transparent 90px),
    linear-gradient(160deg, #2a2118 0%, var(--bg1) 40%, #1a140e 100%);
  border:2px solid var(--iron-hi);
  box-shadow:
    inset 0 0 0 1px var(--bg0),
    0 0 0 1px rgba(212,160,23,.12),
    0 20px 60px rgba(0,0,0,.75);
  padding:28px 26px 24px;
}
.panel .corner{
  position:absolute;width:18px;height:18px;
  stroke:var(--gold);fill:none;stroke-width:1.6;
}
.panel .corner.tl{top:6px;left:6px}
.panel .corner.tr{top:6px;right:6px;transform:scaleX(-1)}
.panel .corner.bl{bottom:6px;left:6px;transform:scaleY(-1)}
.panel .corner.br{bottom:6px;right:6px;transform:scale(-1)}

.brand{text-align:center;margin-bottom:24px}
.brand h1{
  font-family:var(--font-display);
  font-size:36px;font-weight:700;margin:0;
  letter-spacing:.14em;
  color:var(--ink);
  text-shadow:0 0 24px rgba(212,160,23,.25);
}
.brand .rune-row{
  margin-top:10px;font-size:14px;letter-spacing:.4em;
  color:var(--gold-dim);
}


.divider{
  display:flex;align-items:center;gap:10px;margin:0 0 22px;
}
.divider .line{flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--iron-hi))}
.divider .line.r{background:linear-gradient(90deg,var(--iron-hi),transparent)}

.field{margin-bottom:14px}
.field label{
  display:block;font-size:10px;font-weight:700;
  letter-spacing:.16em;text-transform:uppercase;
  color:var(--ink-mute);margin-bottom:6px;
}
.field .input-wrap{position:relative;display:flex;align-items:center}
.field input[type="text"],
.field input[type="password"]{
  width:100%;
  appearance:none;
  background:var(--bg0);
  border:1px solid var(--iron-hi);
  color:var(--ink);
  font-family:var(--font-ui);
  font-size:14px;
  padding:12px 40px 12px 12px;
  outline:none;
  box-shadow:inset 0 2px 6px rgba(0,0,0,.45);
  transition:border-color .15s, box-shadow .15s;
}
.field input:focus{
  border-color:var(--gold);
  box-shadow:inset 0 2px 6px rgba(0,0,0,.45), 0 0 0 1px rgba(212,160,23,.35);
}
.field input::placeholder{color:var(--ink-mute)}
.field .icon{
  position:absolute;right:10px;width:18px;height:18px;
  color:var(--ink-mute);pointer-events:none;
}
.eye{
  position:absolute;right:10px;width:28px;height:28px;
  background:transparent;border:none;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  color:var(--ink-mute);padding:0;
}
.eye:hover{color:var(--gold)}
.eye svg{width:18px;height:18px}

.row-between{
  display:flex;align-items:center;justify-content:space-between;
  margin:14px 0 18px;gap:10px;
}
.check{
  display:flex;align-items:center;gap:8px;
  font-size:12px;color:var(--ink-dim);cursor:pointer;user-select:none;
}
.check input{
  appearance:none;width:16px;height:16px;margin:0;
  border:1px solid var(--iron-hi);background:var(--bg0);
  cursor:pointer;position:relative;flex-shrink:0;
  box-shadow:inset 0 1px 3px rgba(0,0,0,.5);
}
.check input:checked{
  border-color:var(--gold);background:rgba(212,160,23,.15);
}
.check input:checked::after{
  content:"";position:absolute;left:4px;top:1px;
  width:5px;height:9px;border:solid var(--gold);
  border-width:0 1.5px 1.5px 0;transform:rotate(45deg);
}
.link-btn{
  background:none;border:none;padding:0;cursor:pointer;
  font-size:11px;color:var(--ink-mute);
  letter-spacing:.06em;text-transform:uppercase;font-weight:600;
  font-family:var(--font-ui);
}
.link-btn:hover{color:var(--gold)}


.btn-shield{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  width:100%;
  font-family:var(--font-ui);font-size:13px;font-weight:700;
  letter-spacing:.12em;text-transform:uppercase;
  padding:14px 20px 18px;
  cursor:pointer;border:none;color:#1a1408;
  clip-path:polygon(10px 0,calc(100% - 10px) 0,100% 10px,100% calc(100% - 6px),50% 100%,0 calc(100% - 6px),0 10px);
  background:linear-gradient(180deg,#e0bc38 0%,#c9a227 45%,#9a7a1a 100%);
  transition:filter .15s, transform .1s;
  text-shadow:0 1px 0 rgba(255,255,255,.25);
}
.btn-shield:hover:not(:disabled){filter:brightness(1.12)}
.btn-shield:active:not(:disabled){transform:translateY(1px)}
.btn-shield:disabled{
  background:linear-gradient(180deg,#3d3228,#2a2118);
  color:var(--ink-mute);
  cursor:not-allowed;
  text-shadow:none;
}
.btn-google{
  display:flex;align-items:center;justify-content:center;gap:10px;
  width:100%;
  font-family:var(--font-ui);font-size:13px;font-weight:700;
  letter-spacing:.12em;text-transform:uppercase;
  padding:12px 18px 14px;cursor:pointer;
  background:
    linear-gradient(180deg, rgba(255,255,255,.05) 0%, transparent 40%),
    linear-gradient(180deg,#3d3228 0%,#241c14 55%,#1a140e 100%);
  border:1px solid var(--iron-hi);
  color:var(--ink-dim);
  
  border-radius:2px;
  transition:filter .15s, border-color .15s, color .15s;
}
.btn-google:hover{
  filter:brightness(1.15);
  border-color:var(--gold-dim);
  color:var(--ink);
}
.btn-google:active{filter:brightness(1.05)}
.btn-google .g-icon{
  width:20px;height:20px;flex-shrink:0;
  display:block;
}
.or{
  display:flex;align-items:center;gap:12px;margin:16px 0;
  font-size:10px;letter-spacing:.2em;text-transform:uppercase;
  color:var(--ink-mute);
}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--iron)}


.msg{
  display:none;
  align-items:flex-start;gap:8px;
  margin-top:14px;padding:10px 12px;
  font-size:12px;line-height:1.4;
  border-left:3px solid transparent;
}
.msg.show{display:flex}
.msg svg{width:16px;height:16px;flex-shrink:0;margin-top:1px}
.msg.error{
  background:rgba(163,59,59,.12);
  border-left-color:var(--blood-hi);
  color:#f0a0a0;
}
.msg.success{
  background:rgba(90,158,90,.12);
  border-left-color:var(--ok);
  color:#a0d8a0;
}
.msg.info{
  background:rgba(212,160,23,.1);
  border-left-color:var(--gold);
  color:var(--gold-hi);
}


.overlay{
  position:fixed;inset:0;z-index:10;
  background:rgba(8,6,4,.78);
  display:none;align-items:center;justify-content:center;
  padding:24px;
}
.overlay.open{display:flex}
.settings{
  position:relative;width:min(440px,100%);
  background:linear-gradient(160deg,#2a2118,#1a140e);
  border:2px solid var(--iron-hi);
  box-shadow:inset 0 0 0 1px var(--bg0), 0 20px 60px rgba(0,0,0,.8);
  padding:28px 24px;
}
.settings h2{
  font-family:var(--font-display);font-size:18px;margin:0 0 4px;
  letter-spacing:.1em;text-transform:uppercase;color:var(--gold);
}
.settings .sub{font-size:11px;color:var(--ink-mute);margin-bottom:20px;letter-spacing:.06em}
.set-row{
  display:flex;align-items:center;justify-content:space-between;
  gap:16px;padding:12px 0;border-bottom:1px solid rgba(61,50,40,.6);
}
.set-row:last-of-type{border-bottom:none}
.set-row .k{font-size:12px;color:var(--ink-dim);letter-spacing:.04em}
.set-row .ctrl{display:flex;align-items:center;gap:10px;min-width:140px;justify-content:flex-end}
input[type="range"]{
  appearance:none;width:120px;height:4px;
  background:var(--iron);outline:none;border-radius:2px;
}
input[type="range"]::-webkit-slider-thumb{
  appearance:none;width:14px;height:14px;
  background:var(--gold);border-radius:50%;cursor:pointer;
  box-shadow:0 0 6px rgba(212,160,23,.5);
}
.vol-val{font-family:var(--font-num);font-size:11px;color:var(--gold-hi);width:32px;text-align:right}
.toggle{
  appearance:none;width:40px;height:22px;margin:0;
  background:var(--bg0);border:1px solid var(--iron-hi);
  position:relative;cursor:pointer;border-radius:11px;
}
.toggle::after{
  content:"";position:absolute;top:2px;left:2px;
  width:16px;height:16px;border-radius:50%;
  background:var(--ink-mute);transition:all .15s;
}
.toggle:checked{border-color:var(--gold);background:rgba(212,160,23,.2)}
.toggle:checked::after{left:20px;background:var(--gold)}
.settings .btn-row{display:flex;gap:10px;margin-top:22px}

.btn-ghost{
  flex:1;display:inline-flex;align-items:center;justify-content:center;
  font-family:var(--font-ui);font-size:12px;font-weight:700;
  letter-spacing:.1em;text-transform:uppercase;
  padding:10px 14px;cursor:pointer;border:1px solid var(--iron-hi);
  color:var(--ink-dim);
  background:
    linear-gradient(180deg, rgba(255,255,255,.04) 0%, transparent 50%),
    linear-gradient(180deg,#3d3228 0%,#241c14 60%,#1a140e 100%);
  border-radius:2px;
  transition:filter .15s, border-color .15s, color .15s;
}
.btn-ghost:hover{
  filter:brightness(1.15);
  border-color:var(--gold-dim);
  color:var(--ink);
}
.btn-gold-sm{
  flex:1;display:inline-flex;align-items:center;justify-content:center;
  font-family:var(--font-ui);font-size:12px;font-weight:700;
  letter-spacing:.1em;text-transform:uppercase;
  padding:10px 14px;cursor:pointer;border:none;color:#1a1408;
  background:linear-gradient(180deg,#e0bc38,#9a7a1a);
  border-radius:2px;
  transition:filter .15s;
}
.btn-gold-sm:hover{filter:brightness(1.1)}
.btn-opt{
  position:absolute;top:14px;right:14px;
  width:36px;height:36px;
  display:flex;align-items:center;justify-content:center;
  background:transparent;border:1px solid var(--iron);
  color:var(--ink-mute);cursor:pointer;z-index:2;
}
.btn-opt:hover{border-color:var(--gold);color:var(--gold)}
.btn-opt svg{width:18px;height:18px}


.stage.leaving .panel{
  animation:fadeOut .55s ease forwards;
}
@keyframes fadeOut{
  to{opacity:0;transform:scale(.98) translateY(-8px)}
}
.next-hint{
  display:none;text-align:center;margin-top:28px;
  font-size:13px;color:var(--gold-hi);
  font-family:var(--font-display);letter-spacing:.08em;
}
.next-hint.show{display:block}
</style>
</head>
<body>

<div class="viewport">
<div class="stage" id="stage">
  <div class="panel">
    <svg class="corner tl" viewBox="0 0 18 18"><path d="M1 17 V5 Q1 1 5 1 H17"/></svg>
    <svg class="corner tr" viewBox="0 0 18 18"><path d="M1 17 V5 Q1 1 5 1 H17"/></svg>
    <svg class="corner bl" viewBox="0 0 18 18"><path d="M1 17 V5 Q1 1 5 1 H17"/></svg>
    <svg class="corner br" viewBox="0 0 18 18"><path d="M1 17 V5 Q1 1 5 1 H17"/></svg>

    <button type="button" class="btn-opt" id="btnOptions" title="Opções" aria-label="Opções">
      
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path fill="currentColor" d="M19.14 12.94c.04-.31.06-.63.06-.94s-.02-.63-.06-.94l2.03-1.58a.5.5 0 0 0 .12-.64l-1.92-3.32a.5.5 0 0 0-.61-.22l-2.39.96a7.03 7.03 0 0 0-1.62-.94l-.36-2.54a.5.5 0 0 0-.5-.42h-3.84a.5.5 0 0 0-.5.42l-.36 2.54c-.59.24-1.13.56-1.62.94l-2.39-.96a.5.5 0 0 0-.61.22L2.71 8.84a.5.5 0 0 0 .12.64l2.03 1.58c-.04.31-.06.63-.06.94s.02.63.06.94l-2.03 1.58a.5.5 0 0 0-.12.64l1.92 3.32c.13.22.39.3.61.22l2.39-.96c.49.38 1.03.7 1.62.94l.36 2.54c.04.24.25.42.5.42h3.84c.25 0 .46-.18.5-.42l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.48 0 .61-.22l1.92-3.32a.5.5 0 0 0-.12-.64l-2.03-1.58zM12 15.6A3.6 3.6 0 1 1 12 8.4a3.6 3.6 0 0 1 0 7.2z"/>
      </svg>
    </button>

    <div class="brand">
      <h1>UAIDZIN</h1>
      <div class="rune-row">ᚠ ᚢ ᚦ ᚨ ᚱ ᛉ</div>
    </div>

    <div class="divider">
      <span class="line"></span>
      <svg width="40" height="16" viewBox="0 0 40 16" fill="none">
        <path d="M2 8 H12 L15 4 L18 12 L20 4 L22 12 L25 4 L28 8 H38" stroke="#d4a017" stroke-width="1.2"/>
        <circle cx="20" cy="8" r="2" fill="#d4a017"/>
      </svg>
      <span class="line r"></span>
    </div>

    <form id="loginForm" autocomplete="on" novalidate>
      <div class="field">
        <label for="user">Login</label>
        <div class="input-wrap">
          <input type="text" id="user" name="username" placeholder="nome do usuario" autocomplete="username" spellcheck="false">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
            <circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/>
          </svg>
        </div>
      </div>

      <div class="field">
        <label for="pass">Senha</label>
        <div class="input-wrap">
          <input type="password" id="pass" name="password" placeholder="••••••••" autocomplete="current-password">
          <button type="button" class="eye" id="togglePass" aria-label="Mostrar senha">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
              <path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>
            </svg>
          </button>
        </div>
      </div>

      <div class="row-between">
        <label class="check">
          <input type="checkbox" id="saveCreds">
          <span>Salvar credenciais</span>
        </label>
      </div>

      <button type="submit" class="btn-shield" id="btnLogin" disabled>Entrar</button>

      <div class="or"><span>ou</span></div>

      <button type="button" class="btn-google" id="btnGoogle">
        
        <svg class="g-icon" viewBox="0 0 24 24" aria-hidden="true">
          <path fill="#d4a017" d="M12 10.2v3.6h5.1c-.2 1.2-1.5 3.6-5.1 3.6-3.1 0-5.6-2.5-5.6-5.6S8.9 6.2 12 6.2c1.8 0 2.9.7 3.6 1.4l2.4-2.4C16.6 3.8 14.5 3 12 3 6.9 3 2.8 7.1 2.8 12S6.9 21 12 21c5.5 0 9.1-3.9 9.1-9.3 0-.6-.1-1.1-.2-1.5H12z"/>
        </svg>
        Entrar com Google
      </button>

      <div class="msg error" id="msgError" role="alert">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16h.01"/>
        </svg>
        <span id="msgErrorText"></span>
      </div>
      <div class="msg success" id="msgSuccess" role="status">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <circle cx="12" cy="12" r="9"/><path d="M8 12l3 3 5-6"/>
        </svg>
        <span id="msgSuccessText"></span>
      </div>
      <div class="msg info" id="msgInfo" role="status">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/>
        </svg>
        <span id="msgInfoText"></span>
      </div>
    </form>
  </div>

  <div class="next-hint" id="nextHint">Aurelion</div>
</div>
</div>


<div class="overlay" id="overlaySettings" role="dialog" aria-modal="true" aria-labelledby="setTitle">
  <div class="settings">
    <svg class="corner tl" viewBox="0 0 18 18" style="position:absolute;top:6px;left:6px;width:18px;height:18px;stroke:#d4a017;fill:none;stroke-width:1.6"><path d="M1 17 V5 Q1 1 5 1 H17"/></svg>
    <svg class="corner tr" viewBox="0 0 18 18" style="position:absolute;top:6px;right:6px;width:18px;height:18px;stroke:#d4a017;fill:none;stroke-width:1.6;transform:scaleX(-1)"><path d="M1 17 V5 Q1 1 5 1 H17"/></svg>
    <svg class="corner bl" viewBox="0 0 18 18" style="position:absolute;bottom:6px;left:6px;width:18px;height:18px;stroke:#d4a017;fill:none;stroke-width:1.6;transform:scaleY(-1)"><path d="M1 17 V5 Q1 1 5 1 H17"/></svg>
    <svg class="corner br" viewBox="0 0 18 18" style="position:absolute;bottom:6px;right:6px;width:18px;height:18px;stroke:#d4a017;fill:none;stroke-width:1.6;transform:scale(-1)"><path d="M1 17 V5 Q1 1 5 1 H17"/></svg>

    <h2 id="setTitle">Opções</h2>

    <div class="set-row">
      <span class="k">Volume mestre</span>
      <div class="ctrl">
        <input type="range" id="volMaster" min="0" max="100" value="80">
        <span class="vol-val" id="volMasterVal">80</span>
      </div>
    </div>
    <div class="set-row">
      <span class="k">Música</span>
      <div class="ctrl">
        <input type="range" id="volMusic" min="0" max="100" value="60">
        <span class="vol-val" id="volMusicVal">60</span>
      </div>
    </div>
    <div class="set-row">
      <span class="k">Efeitos</span>
      <div class="ctrl">
        <input type="range" id="volSfx" min="0" max="100" value="90">
        <span class="vol-val" id="volSfxVal">90</span>
      </div>
    </div>
    <div class="set-row">
      <span class="k">Tela cheia</span>
      <div class="ctrl">
        <input type="checkbox" class="toggle" id="optFullscreen">
      </div>
    </div>
    <div class="set-row">
      <span class="k">Sombras</span>
      <div class="ctrl">
        <input type="checkbox" class="toggle" id="optShadows" checked>
      </div>
    </div>

    <div class="btn-row">
      <button type="button" class="btn-ghost" id="btnSettingsCancel">Fechar</button>
      <button type="button" class="btn-gold-sm" id="btnSettingsSave">Salvar</button>
    </div>
  </div>
</div>

<script src="assets/save-store.js"></script>
<script>(function(){
  const $ = (id) => document.getElementById(id);
  const user = $("user");
  const pass = $("pass");
  const saveCreds = $("saveCreds");
  const btnLogin = $("btnLogin");
  const form = $("loginForm");
  const msgError = $("msgError");
  const msgErrorText = $("msgErrorText");
  const msgSuccess = $("msgSuccess");
  const msgSuccessText = $("msgSuccessText");
  const msgInfo = $("msgInfo");
  const msgInfoText = $("msgInfoText");

  function hideMsgs(){
    msgError.classList.remove("show");
    msgSuccess.classList.remove("show");
    msgInfo.classList.remove("show");
  }
  function showMsg(el, textEl, text){
    hideMsgs();
    textEl.textContent = text;
    el.classList.add("show");
  }
  function fieldsFilled(){
    return user.value.trim().length > 0 && pass.value.length > 0;
  }
  function refreshBtn(){
    btnLogin.disabled = !fieldsFilled();
  }

  UaidzinSave.bootstrap().then(() => {
    console.log("bootstrap ok", UaidzinSave._debug);
  }).catch((e) => console.error("bootstrap", e));

  user.addEventListener("input", () => { hideMsgs(); refreshBtn(); });
  pass.addEventListener("input", () => { hideMsgs(); refreshBtn(); });

  $("togglePass").addEventListener("click", () => {
    pass.type = pass.type === "password" ? "text" : "password";
  });

  try {
    if (UaidzinSave.getSession()) {
      if (window.parent && window.parent !== window) {
        window.parent.postMessage({ type: "uaidzin-boot-login-ok", session: UaidzinSave.getSession() }, "*");
      } else {
        window.location.href = "02-selecao-personagem.html";
      }
    }
  } catch (_) {}

  try {
    const savedUser = UaidzinSave.readRememberedUser
      ? UaidzinSave.readRememberedUser()
      : null;
    const saved = savedUser
      ? { user: savedUser }
      : JSON.parse(localStorage.getItem("uaidzin_login") || "null");
    if (saved && saved.user) {
      user.value = saved.user;
      pass.value = "";
      saveCreds.checked = true;
      refreshBtn();
    }
  } catch (_) {}

  form.addEventListener("submit", (e) => {
    e.preventDefault();
    const u = user.value.trim();
    const p = pass.value;

    if (!u || !p) {
      showMsg(msgError, msgErrorText, "Preencha login e senha para entrar.");
      return;
    }

    btnLogin.disabled = true;
    btnLogin.textContent = "Verificando…";

    UaidzinSave.bootstrap()
      .then(() => UaidzinSave.login(u, p))
      .then((res) => {
        btnLogin.textContent = "Entrar";
        refreshBtn();

        if (!res || !res.ok) {
          showMsg(msgError, msgErrorText, (res && res.error) || "Login ou senha inválidos.");
          pass.value = "";
          refreshBtn();
          return;
        }

        if (saveCreds.checked) {
          if (UaidzinSave.rememberUser) UaidzinSave.rememberUser(u);
          else localStorage.setItem("uaidzin_login", JSON.stringify({ user: u }));
        } else {
          if (UaidzinSave.rememberUser) UaidzinSave.rememberUser(null);
          else localStorage.removeItem("uaidzin_login");
        }

        showMsg(msgSuccess, msgSuccessText, "Bem-vindo, " + u + ".");
        setTimeout(() => {
          $("stage").classList.add("leaving");
          if (window.parent && window.parent !== window) {
            const session = UaidzinSave.getSession();
            window.parent.postMessage({ type: "uaidzin-boot-login-ok", session: session }, "*");
          } else {
            window.location.href = "02-selecao-personagem.html";
          }
        }, 650);
      })
      .catch((err) => {
        console.error("login", err);
        btnLogin.textContent = "Entrar";
        refreshBtn();
        showMsg(msgError, msgErrorText, "Falha ao entrar.");
      });
  });

  $("btnGoogle").addEventListener("click", () => {
    hideMsgs();
    btnLogin.disabled = true;
    showMsg(msgInfo, msgInfoText, "Conectando ao Google…");
    setTimeout(() => {
      user.value = "admin";
      pass.value = "admin";
      saveCreds.checked = true;
      refreshBtn();
      showMsg(msgSuccess, msgSuccessText, "Conta do Google vinculada. Clique em Entrar.");
    }, 900);
  });

  const overlay = $("overlaySettings");
  $("btnOptions").addEventListener("click", () => {
    overlay.classList.add("open");
    hideMsgs();
  });
  $("btnSettingsCancel").addEventListener("click", () => overlay.classList.remove("open"));
  overlay.addEventListener("click", (e) => {
    if (e.target === overlay) overlay.classList.remove("open");
  });

  const SETTINGS_KEY = "uaidzin_settings";
  const ranges = [
    ["volMaster", "volMasterVal"],
    ["volMusic", "volMusicVal"],
    ["volSfx", "volSfxVal"],
  ];
  function loadSettings(){
    try {
      const s = JSON.parse(localStorage.getItem(SETTINGS_KEY) || "{}");
      ranges.forEach(([r, v]) => {
        if (s[r] != null) { $(r).value = s[r]; $(v).textContent = s[r]; }
      });
      if (s.optFullscreen != null) $("optFullscreen").checked = s.optFullscreen;
      if (s.optShadows != null) $("optShadows").checked = s.optShadows;
    } catch (_) {}
  }
  function saveSettings(){
    const s = {};
    ranges.forEach(([r]) => { s[r] = Number($(r).value); });
    s.optFullscreen = $("optFullscreen").checked;
    s.optShadows = $("optShadows").checked;
    localStorage.setItem(SETTINGS_KEY, JSON.stringify(s));
  }
  ranges.forEach(([r, v]) => {
    $(r).addEventListener("input", () => { $(v).textContent = $(r).value; });
  });
  $("btnSettingsSave").addEventListener("click", () => {
    saveSettings();
    overlay.classList.remove("open");
    showMsg(msgSuccess, msgSuccessText, "Opções salvas.");
  });
  loadSettings();
  refreshBtn();

  function fitStage(){
    const stage = document.getElementById("stage");
    if (!stage) return;
    const s = Math.min(window.innerWidth / 1600, window.innerHeight / 900);
    stage.style.transform = "scale(" + s + ")";
    const mx = (1600 * s - 1600) / 2;
    const my = (900 * s - 900) / 2;
    stage.style.margin = my + "px " + mx + "px";
  }
  window.addEventListener("resize", fitStage);
  if (window.ResizeObserver) new ResizeObserver(fitStage).observe(document.documentElement);
  fitStage();
})();
</script>
</body>
</html>
