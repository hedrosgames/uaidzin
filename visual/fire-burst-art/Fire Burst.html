<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fire Burst</title>
<style>
:root { color-scheme: dark; --inspection-background: #100c08; }
* { box-sizing: border-box; }
html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: transparent; user-select: none; }
body { display: flex; align-items: center; justify-content: center; }
body.inspection { background: var(--inspection-background); }
canvas { display: block; width: min(100vw, 177.777778vh); height: auto; aspect-ratio: 16 / 9; flex: none; }
</style>
</head>
<body>
<canvas id="fire-burst" width="1600" height="900" role="img" aria-label="Explosão de fogo animada"></canvas>
<script>
(() => {
  'use strict';
  const canvas = document.getElementById('fire-burst');
  const ctx = canvas.getContext('2d', { alpha: true });
  const duration = 2.7;
  const releaseTime = 0.19;
  const travelDuration = 0.51;
  const TAU = Math.PI * 2;
  const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
  const smooth = (a, b, x) => { const u = clamp((x - a) / (b - a)); return u * u * (3 - 2 * u); };
  const fract = x => x - Math.floor(x);
  const hash = n => fract(Math.sin(n * 127.1 + 311.7) * 43758.5453123);
  const colors = ['#b62c22', '#ef491b', '#ff871f', '#ffcb43', '#fff2bd'];
  const origin = { x: 224, y: 461 };
  const streams = [
    { end: [1290, 199], a: [488, 58], b: [859, 423], width: 35, phase: 1.3, delay: 0.014 },
    { end: [1208, 724], a: [488, 795], b: [892, 490], width: 39, phase: 3.1, delay: 0.050 },
    { end: [1350, 321], a: [524, 660], b: [841, 49], width: 37, phase: 5.2, delay: 0.027 },
    { end: [1345, 585], a: [487, 203], b: [860, 830], width: 44, phase: 0.2, delay: 0.063 },
    { end: [1400, 453], a: [574, 661], b: [899, 244], width: 47, phase: 4.2, delay: 0 },
    { end: [1127, 106], a: [384, 333], b: [803, 442], width: 29, phase: 2.4, delay: 0.038 }
  ];
  function sprite(variant) {
    const image = document.createElement('canvas');
    image.width = 336; image.height = 208;
    const c = image.getContext('2d');
    c.translate(5, 12 + variant * 2);
    c.fillStyle = colors[0];
    c.beginPath(); c.moveTo(17, 109);
    c.bezierCurveTo(48, 87, 21, 57, 94, 52);
    c.quadraticCurveTo(118, 50, 100, 17);
    c.bezierCurveTo(160, 23, 154, 69, 205, 46);
    c.quadraticCurveTo(191, 66, 177, 72);
    c.bezierCurveTo(238, 73, 269, 10 + variant * 8, 320, 37);
    c.bezierCurveTo(278, 45, 280, 95, 238, 107);
    c.quadraticCurveTo(248, 118, 289, 111);
    c.bezierCurveTo(253, 139, 228, 145, 203, 134);
    c.quadraticCurveTo(230, 157, 214, 179);
    c.bezierCurveTo(186, 140, 161, 179, 115, 156);
    c.quadraticCurveTo(131, 146, 129, 131);
    c.bezierCurveTo(91, 160, 59, 123, 17, 109); c.fill();
    c.fillStyle = colors[1];
    c.beginPath(); c.moveTo(33, 105);
    c.bezierCurveTo(80, 95, 52, 65, 116, 61);
    c.quadraticCurveTo(125, 48, 115, 36);
    c.bezierCurveTo(155, 72, 145, 89, 201, 75);
    c.bezierCurveTo(237, 69, 256, 47, 299, 40);
    c.bezierCurveTo(269, 64, 272, 93, 213, 106);
    c.quadraticCurveTo(234, 132, 257, 124);
    c.bezierCurveTo(222, 149, 195, 112, 180, 130);
    c.quadraticCurveTo(193, 137, 199, 152);
    c.bezierCurveTo(153, 128, 158, 159, 122, 146);
    c.quadraticCurveTo(147, 132, 135, 117);
    c.bezierCurveTo(88, 138, 77, 107, 33, 105); c.fill();
    c.fillStyle = colors[2];
    c.beginPath(); c.moveTo(42, 106);
    c.bezierCurveTo(88, 105, 91, 71, 124, 78);
    c.quadraticCurveTo(146, 106, 173, 94);
    c.quadraticCurveTo(218, 94, 273, 57);
    c.bezierCurveTo(249, 99, 211, 102, 189, 109);
    c.quadraticCurveTo(192, 131, 212, 135);
    c.bezierCurveTo(178, 138, 169, 109, 150, 117);
    c.bezierCurveTo(115, 135, 89, 108, 42, 106); c.fill();
    c.fillStyle = colors[3];
    c.beginPath(); c.moveTo(43, 107);
    c.bezierCurveTo(106, 104, 116, 88, 136, 99);
    c.bezierCurveTo(158, 115, 182, 99, 230, 88);
    c.bezierCurveTo(190, 117, 175, 108, 161, 123);
    c.bezierCurveTo(148, 110, 138, 105, 126, 114);
    c.quadraticCurveTo(82, 113, 43, 107); c.fill();
    c.fillStyle = colors[4];
    c.beginPath(); c.moveTo(55, 107);
    c.quadraticCurveTo(116, 100, 152, 108);
    c.quadraticCurveTo(128, 118, 104, 109);
    c.quadraticCurveTo(84, 108, 55, 107); c.fill();
    return image;
  }
  const flames = [sprite(0), sprite(1), sprite(2)];
  function stamp(image, x, y, angle, length, height, alpha = 1, flip = 1) {
    if (alpha <= 0 || length <= 0 || height <= 0) return;
    ctx.save(); ctx.globalAlpha = clamp(alpha);
    ctx.translate(x, y); ctx.rotate(angle); ctx.scale(1, flip);
    ctx.drawImage(image, -length * 0.17, -height * 0.58, length, height);
    ctx.restore();
  }
  function point(flow, u, t) {
    const v = 1 - u;
    const x = v * v * v * origin.x + 3 * v * v * u * flow.a[0] + 3 * v * u * u * flow.b[0] + u * u * u * flow.end[0];
    const y = v * v * v * origin.y + 3 * v * v * u * flow.a[1] + 3 * v * u * u * flow.b[1] + u * u * u * flow.end[1];
    const gate = Math.sin(Math.PI * u);
    return { x: x + gate * 13 * Math.sin(u * 12 - t * 6 + flow.phase), y: y + gate * (22 * Math.sin(u * 13 - t * 8 + flow.phase) + 10 * Math.sin(u * 24 - t * 11 + flow.phase)) };
  }
  function basis(flow, u, t) {
    const p = point(flow, u, t);
    const a = point(flow, Math.max(0, u - 0.002), t);
    const b = point(flow, Math.min(1, u + 0.002), t);
    const angle = Math.atan2(b.y - a.y, b.x - a.x);
    return { ...p, angle, nx: -Math.sin(angle), ny: Math.cos(angle) };
  }
  function contour(samples, flow, t, scale, color, hot = false) {
    ctx.fillStyle = color; ctx.beginPath();
    for (let side = 1; side >= -1; side -= 2) {
      for (let k = 0; k < samples.length; k++) {
        const p = samples[side === 1 ? k : samples.length - 1 - k];
        const tooth = Math.pow(clamp(1 - Math.abs(fract(p.u * 13.7 - t * 2.8 + flow.phase + side * 0.29) - 0.7) / 0.23), 2);
        const ripple = 0.89 + 0.12 * Math.sin(p.u * 73 - t * 20 + side * 2 + flow.phase) + tooth * (hot ? 0.25 : 0.52);
        const pulse = hot ? Math.pow(Math.max(0, Math.sin(p.u * 19 - t * 15 + flow.phase)), 2) : 1;
        const w = p.w * scale * ripple * pulse;
        const offset = p.w * (hot ? -0.08 : (1 - scale) * 0.12) + side * w;
        const x = p.x + p.nx * offset, y = p.y + p.ny * offset;
        if (side === 1 && k === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
      }
    }
    ctx.closePath(); ctx.fill();
  }
  function ribbon(flow, index, t) {
    const local = t - releaseTime - flow.delay;
    if (local <= 0) return;
    const head = 1 - Math.pow(1 - clamp(local / travelDuration), 1.7);
    const tail = smooth(1.47 + flow.delay, 1.95 + flow.delay, t);
    const power = smooth(0, 0.08, local) * (1 - smooth(1.65, 2.05, t));
    if (head - tail < 0.006 || power <= 0) return;
    const samples = [];
    const count = Math.max(8, Math.ceil((head - tail) * 156));
    for (let i = 0; i <= count; i++) {
      const u = tail + (head - tail) * i / count;
      const p = basis(flow, u, t);
      const taper = smooth(tail, tail + 0.035, u) * (1 - smooth(head - 0.078, head, u));
      const surge = 0.86 + 0.18 * Math.sin(u * 17 - t * 14 + flow.phase) + 0.14 * Math.sin(u * 31 - t * 19);
      p.u = u; p.w = (3 + flow.width * Math.pow(u, 0.72)) * taper * surge * power;
      samples.push(p);
    }
    contour(samples, flow, t, 1, colors[0]);
    contour(samples, flow, t, 0.88, colors[1]);
    contour(samples, flow, t, 0.69, colors[2]);
    contour(samples, flow, t, 0.43, colors[3]);
    contour(samples, flow, t, 0.27, colors[4], true);
    for (let j = 0; j < 8; j++) {
      const u = 0.07 + fract(j / 8 + local * 0.56 + index * 0.093) * 0.90;
      const visibility = smooth(tail, tail + 0.08, u) * (1 - smooth(head - 0.13, head, u));
      if (visibility <= 0) continue;
      const p = basis(flow, u, t);
      const side = j % 2 === 0 ? 1 : -1;
      const w = (6 + flow.width * Math.pow(u, 0.72)) * power;
      const curl = side * (0.24 + 0.23 * Math.sin(t * 8 + j * 2 + index));
      stamp(flames[(j + index) % 3], p.x + p.nx * w * side * 0.45, p.y + p.ny * w * side * 0.45, p.angle + curl, (63 + u * 94) * power, (29 + u * 49) * visibility * power, 1, side);
    }
    const p = basis(flow, head, t);
    stamp(flames[index % 3], p.x - Math.cos(p.angle) * 55 * power, p.y - Math.sin(p.angle) * 55 * power, p.angle, (95 + 49 * head) * power, (45 + 27 * head) * power, 1, index % 2 ? -1 : 1);
  }
  function impact(flow, index, t) {
    const age = t - releaseTime - flow.delay - travelDuration;
    if (age < 0 || age > 0.29) return;
    const life = age / 0.29;
    const size = (24 + 70 * Math.pow(life, 0.35)) * (1 - life * 0.48);
    const p = basis(flow, 1, t);
    ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.angle);
    ctx.globalAlpha = 1 - smooth(0.35, 1, life);
    for (let layer = 0; layer < 3; layer++) {
      const radius = size * [1, 0.75, 0.47][layer];
      ctx.fillStyle = [colors[2], '#ffd655', '#fff9dd'][layer];
      ctx.beginPath();
      for (let k = 0; k < 16; k++) {
        const angle = k / 16 * TAU + index * 0.41;
        const reach = k % 2 ? 0.27 + hash(k + index * 10) * 0.16 : 0.63 + hash(k * 3 + index) * 0.5;
        const x = Math.cos(angle) * radius * reach * 1.1;
        const y = Math.sin(angle) * radius * reach * 0.82;
        if (k === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
      }
      ctx.closePath(); ctx.fill();
    }
    ctx.restore();
    for (let j = 0; j < 3; j++) {
      const angle = p.angle + (j - 1) * 0.87;
      const distance = 15 + life * 90;
      stamp(flames[(j + index) % 3], p.x + Math.cos(angle) * distance, p.y + Math.sin(angle) * distance, angle, 54 * (1 - life), 29 * (1 - life), 1 - life);
    }
  }
  function embers(t) {
    for (let i = 0; i < 16; i++) {
      const start = 1.72 + hash(i + 12) * 0.13;
      const age = t - start, life = 0.24 + hash(i + 52) * 0.14;
      if (age < 0 || age >= life) continue;
      const flow = streams[i % streams.length];
      const u = 0.37 + hash(i + 80) * 0.62;
      const p = basis(flow, u, start);
      const a = age / life;
      const x = p.x + age * (70 + hash(i) * 150);
      const y = p.y - age * (36 + hash(i + 2) * 90) + age * age * 70;
      stamp(flames[i % 3], x, y, p.angle - 0.3, (13 + hash(i + 4) * 22) * (1 - a), (8 + hash(i + 6) * 12) * (1 - a), 1 - smooth(0.4, 1, a));
    }
  }
  function draw(t) {
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    if (t <= 0 || t >= 2.24) return;
    if (t < 0.24) {
      const charge = smooth(0.015, 0.12, t) * (1 - smooth(0.17, 0.24, t));
      stamp(flames[1], origin.x, origin.y, -0.18, 42 * charge, 41 * charge);
      for (let i = 0; i < 2; i++) {
        const d = (1 - smooth(0.025, 0.19, t)) * 42;
        stamp(flames[i], origin.x - 10, origin.y + (i ? -d : d), i ? 1.15 : -1.15, 28 * charge, 15 * charge);
      }
    }
    streams.forEach((flow, index) => ribbon(flow, index, t));
    const launch = smooth(0.18, 0.23, t) * (1 - smooth(0.38, 0.62, t));
    const feed = smooth(0.20, 0.32, t) * (1 - smooth(1.40, 1.58, t));
    stamp(flames[2], origin.x - 12, origin.y, -0.03, 150 * feed + 80 * launch, 56 * feed + 58 * launch, 1);
    streams.forEach((flow, index) => impact(flow, index, t));
    embers(t);
  }
  let playing = false, request = 0, current = 0, epoch = 0;
  function frame(now) {
    if (!playing) return;
    current = ((now - epoch) / 1000) % duration;
    draw(current); request = requestAnimationFrame(frame);
  }
  function pause() {
    if (playing) {
      current = ((performance.now() - epoch) / 1000) % duration;
      playing = false; cancelAnimationFrame(request); request = 0; draw(current);
    }
    return canvas;
  }
  function renderAt(seconds) {
    const value = Number(seconds);
    if (!Number.isFinite(value)) throw new TypeError('O tempo deve ser um número finito.');
    playing = false; cancelAnimationFrame(request); request = 0;
    current = clamp(value, 0, duration); draw(current);
    return canvas;
  }
  function play() {
    if (playing) return;
    if (current >= duration) current = 0;
    playing = true; epoch = performance.now() - current * 1000;
    request = requestAnimationFrame(frame);
  }
  window.FireBurst = Object.freeze({
    duration, renderAt, play, pause, canvas,
    get playing() { return playing; },
    get time() { return current; },
    timings: Object.freeze({ anticipation: [0.015, 0.24], launch: [0.19, 0.32], extension: [0.19, 0.763], sustain: [0.763, 1.47], impact: [0.70, 1.053], dissipation: [1.47, 2.24], empty: [2.24, 2.7] })
  });
  const params = new URLSearchParams(window.location.search);
  if (params.get('bg') === 'dark') document.body.classList.add('inspection');
  const time = params.get('time');
  if (time !== null && time.trim() !== '' && Number.isFinite(Number(time))) renderAt(Number(time));
  else { renderAt(0); play(); }
})();
</script>
</body>
</html>
